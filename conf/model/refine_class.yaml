# @package _global_.model
# Class aggregation at fine resolution only — no spatial aggregation, no bottleneck.
# Learns inter-class co-occurrence (ceiling↔floor, wall↔door) at each point independently.
# Generalises better than spatial agg: class relationships are semantic facts, not scene-specific.
name: refine_class
batch_size: 1

stride: [2, 2]
enc_depths: [2, 2, 2]
enc_channels: [112, 200, 400]
enc_num_head: [2, 4, 8]
enc_patch_size: [1024, 1024, 1024]
dec_depths: [2, 2]
# dec_channels[0] = class_subset (injected at runtime); must be divisible by dec_num_head[0]=4
dec_channels_rest: [200]
dec_num_head: [4, 8]
dec_patch_size: [1024, 1024]
enable_flash: true
enable_skip: false

refinement:
  input_skip: true             # add PTv3 input logits to final output
  d_head: 16

  class:
    num_layers: 1
    mlp_ratio: 4
