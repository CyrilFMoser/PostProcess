# @package _global_.model
name: medium_inter
batch_size: 1

stride: [2, 2]
enc_depths: [2, 2, 2]
enc_channels: [112, 200, 400]
enc_num_head: [2, 4, 8]
enc_patch_size: [1024, 1024, 1024]
dec_depths: [2, 2]
# dec_channels[0] = class_subset (injected at runtime); must be divisible by dec_num_head[0]=4
dec_channels_rest: [200]
dec_num_head: [4, 8]
dec_patch_size: [1024, 1024]
enable_flash: true
enable_skip: true              # residual from input logits to decoder output (pre-refinement)

refinement:
  d_head: 16

  spatial:
    num_layers: 1
    mlp_ratio: 2
    enable_flash: true
    random_order: true         # randomise serialisation curve each step to prevent memorisation
    class_chunk: 13            # process 13 of 52 classes per pass; 4x less peak memory
