# @package _global_.model
# Bottleneck class aggregation (encoder→decoder) + class aggregation at fine resolution.
# Bottleneck: class co-occurrence at coarse scale; decoder propagates to fine scale.
# Fine class: additional per-point class refinement on the decoder's actual predictions.
name: refine_bottleneck_class
batch_size: 1

stride: [2, 2]
enc_depths: [2, 2, 2]
enc_channels: [112, 200, 416]  # 416 = 8 * class_subset; enables bottleneck class aggregation
enc_num_head: [2, 4, 8]
enc_patch_size: [1024, 1024, 1024]
dec_depths: [2, 2]
# dec_channels[0] = class_subset (injected at runtime); must be divisible by dec_num_head[0]=4
dec_channels_rest: [200]
dec_num_head: [4, 8]
dec_patch_size: [1024, 1024]
enable_flash: true
enable_skip: false

refinement:
  input_skip: true
  d_head: 16

  bottleneck:                  # class agg at encoder bottleneck; d_head = 416//class_subset = 8
    num_layers: 1
    mlp_ratio: 4

  class:                       # class agg at fine resolution on decoder predictions
    num_layers: 1
    mlp_ratio: 4
